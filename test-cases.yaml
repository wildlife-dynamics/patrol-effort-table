base:
  name: Base
  description: >-
    Mocked IO on the synthetic leg fixtures (dev/fixtures/legs) — primary development case. Default Summarize-by (Patrol Subject) and the form default metric list: the six track metrics plus Active Duration, plus the three other leg presets and a custom metric. Expect one row: Active 9 h, Elapsed 10 h, Leg Count 3, Member-days 6.
  mock_io: true
  mock_io_overrides:
    ecoscope.platform.tasks.io.get_patrols_from_combined_params: dev/fixtures/legs/patrols.parquet
    ecoscope.platform.tasks.io.get_patrol_observations_from_patrols_df_and_combined_params: dev/fixtures/legs/observations.parquet
    ecoscope.platform.tasks.io.get_patrol_segments_from_patrols_df_and_combined_params: dev/fixtures/legs/legs.parquet
    ecoscope.platform.tasks.io.add_patrol_team_names: dev/fixtures/legs/legs-team-names.parquet
    ecoscope.platform.tasks.io.add_patrol_roster_names: dev/fixtures/legs/legs-roster-names.parquet
    ecoscope.platform.tasks.io.add_patrol_type_display_names: dev/fixtures/legs/legs-type-display-names.parquet
  params:
    workflow_details:
      name: "Patrol Effort Table"
      description: "Per-category patrol effort summary table."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2026-01-05T00:00:00"
      until: "2026-01-07T00:00:00"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_patrol_params:
      patrol_types: ["ecoscope_leg_test"]
    groupers:
      groupers: []
    summary_groupers:
      groupers:
        - index_name: "patrol_subject"
    summary_metrics:
      metrics:
        - {metric: patrol_count}
        - {metric: total_distance, unit: km}
        - {metric: total_duration, unit: h}
        - {metric: patrol_days}
        - {metric: area_covered_merged, swath_width_meters: 500.0}
        - {metric: area_covered_unmerged, swath_width_meters: 500.0}
        - {metric: active_duration, unit: h}
        - {metric: elapsed_duration, unit: h}
        - {metric: leg_count}
        - {metric: member_days}
        # custom escape hatch incl. checkbox-gated unit conversion (header "Avg Leg Distance (km)")
        - {metric: custom, display_name: "Avg Leg Distance", aggregator: mean,
           column: dist_meters, convert_units: true, original_unit: m, new_unit: km}


